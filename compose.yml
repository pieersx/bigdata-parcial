services:
  transformers-networks:
    build:
      context: .
      dockerfile: Dockerfile
    image: bigdata-pyspark-notebook
    container_name: bigdata-pyspark
    command: start-notebook.py --ServerApp.root_dir=/home/jovyan/work
    ports:
      - "8000:8888"
      - "4040:4040"
    environment:
      JUPYTER_TOKEN: desarrollo
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      HDFS_NAMENODE_URI: hdfs://namenode:8020
      HIVE_METASTORE_URI: thrift://hive-metastore:9083
    volumes:
      - ./:/home/jovyan/work
    depends_on:
      - mongodb
      - namenode
      - datanode
      - hive-metastore

  mongodb:
    image: mongo:8.0
    container_name: bigdata-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: bigdata-hdfs-namenode
    ports:
      - "9870:9870"
      - "8020:8020"
    environment:
      CLUSTER_NAME: municipal-datalake
      CORE_CONF_fs_defaultFS: hdfs://namenode:8020
      CORE_CONF_hadoop_proxyuser_root_hosts: "*"
      CORE_CONF_hadoop_proxyuser_root_groups: "*"
      CORE_CONF_hadoop_proxyuser_hive_hosts: "*"
      CORE_CONF_hadoop_proxyuser_hive_groups: "*"
    volumes:
      - hdfs_namenode:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: bigdata-hdfs-datanode
    ports:
      - "9864:9864"
    environment:
      SERVICE_PRECONDITION: namenode:9870
      CORE_CONF_fs_defaultFS: hdfs://namenode:8020
      CORE_CONF_hadoop_proxyuser_root_hosts: "*"
      CORE_CONF_hadoop_proxyuser_root_groups: "*"
      CORE_CONF_hadoop_proxyuser_hive_hosts: "*"
      CORE_CONF_hadoop_proxyuser_hive_groups: "*"
    volumes:
      - hdfs_datanode:/hadoop/dfs/data

  hive-metastore-db:
    image: postgres:13
    container_name: bigdata-hive-metastore-db
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive_metastore_db:/var/lib/postgresql/data

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: bigdata-hive-metastore
    command: /opt/hive/bin/hive --service metastore
    ports:
      - "9083:9083"
    environment:
      SERVICE_PRECONDITION: namenode:9870 datanode:9864 hive-metastore-db:5432
      CORE_CONF_fs_defaultFS: hdfs://namenode:8020
      CORE_CONF_hadoop_proxyuser_root_hosts: "*"
      CORE_CONF_hadoop_proxyuser_root_groups: "*"
      CORE_CONF_hadoop_proxyuser_hive_hosts: "*"
      CORE_CONF_hadoop_proxyuser_hive_groups: "*"
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: jdbc:postgresql://hive-metastore-db:5432/metastore
      HIVE_CORE_CONF_javax_jdo_option_ConnectionDriverName: org.postgresql.Driver
      HIVE_CORE_CONF_javax_jdo_option_ConnectionUserName: hive
      HIVE_CORE_CONF_javax_jdo_option_ConnectionPassword: hive
      HIVE_SITE_CONF_hive_metastore_schema_verification: "false"
      HIVE_SITE_CONF_datanucleus_schema_autoCreateAll: "true"
    depends_on:
      - namenode
      - datanode
      - hive-metastore-db

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: bigdata-hive-server
    command: /opt/hive/bin/hive --service hiveserver2
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      SERVICE_PRECONDITION: namenode:9870 datanode:9864 hive-metastore:9083
      CORE_CONF_fs_defaultFS: hdfs://namenode:8020
      CORE_CONF_hadoop_proxyuser_root_hosts: "*"
      CORE_CONF_hadoop_proxyuser_root_groups: "*"
      CORE_CONF_hadoop_proxyuser_hive_hosts: "*"
      CORE_CONF_hadoop_proxyuser_hive_groups: "*"
      HIVE_SITE_CONF_hive_metastore_uris: thrift://hive-metastore:9083
      HIVE_CORE_CONF_javax_jdo_option_ConnectionURL: jdbc:postgresql://hive-metastore-db:5432/metastore
      HIVE_CORE_CONF_javax_jdo_option_ConnectionDriverName: org.postgresql.Driver
      HIVE_CORE_CONF_javax_jdo_option_ConnectionUserName: hive
      HIVE_CORE_CONF_javax_jdo_option_ConnectionPassword: hive
      HIVE_SITE_CONF_hive_metastore_schema_verification: "false"
      HIVE_SITE_CONF_datanucleus_schema_autoCreateAll: "true"
    depends_on:
      - hive-metastore

volumes:
  mongodb_data:
  hdfs_namenode:
  hdfs_datanode:
  hive_metastore_db:
